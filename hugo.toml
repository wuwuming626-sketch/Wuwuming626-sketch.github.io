baseURL = 'https://wuwuming626-sketch.github.io/'
title = '土豆教主的逆袭之路'
languageCode = 'zh-CN'
# 内容语言用 zh，才能命中主题内置的 i18n/zh.yaml（目录、分钟、年份格式等）
defaultContentLanguage = 'zh'
# 中文按下字计数：摘要截断、字数统计、阅读时长才算得对
hasCJKLanguage = true
summaryLength = 60
enableRobotsTXT = true
# 用 git 提交时间作为「最后更新」，CI 里 fetch-depth 已设为 0
enableGitInfo = true
theme = 'PaperMod'

[params]
description = '土豆教主的逆袭之路：一个嵌入式土豆教主的连载式开发记录——项目实战、调试笔记与踩坑复盘，每一篇都是一段打怪升级。'
author = '土豆教主'
keywords = ['嵌入式', '固件开发', 'ATE 产测', '驱动调试', '技术笔记', '踩坑复盘']
# 首页混排全部栏目，否则只会显示文章数最多的那一个栏目
mainSections = ['projects', 'tech-notes', 'solutions', 'posts']
ShowBreadCrumbs = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowReadingTime = true
ShowWordCount = true
ShowShareButtons = false
# 文章都比较长，打开目录便于跳转
ShowToc = true
ShowTocOpen = false
defaultTheme = "auto"
# 栏目与标签列表页标题旁显示 RSS 图标，给订阅一个站内入口
ShowRssButtonInSectionTermList = true
# 开启评论区（模板见 layouts/partials/comments.html，配置见 [params.giscus]）
comments = true

[params.footer]
text = '记录嵌入式固件开发中的项目实战与踩坑复盘 · [RSS 订阅](/index.xml)'

# giscus 评论（基于 GitHub Discussions，无后端）
# 三个 ID 都取自仓库的实际数据（Discussions 已开启，Announcements 为公告型分类）
[params.giscus]
repo = 'wuwuming626-sketch/wuwuming626-sketch.github.io'
repoId = 'R_kgDOSEVD2Q'
category = 'Announcements'
categoryId = 'DIC_kwDOSEVD2c4DFymr'
# 清空这一行会退回「不渲染评论区」的状态
mapping = 'pathname'
reactionsEnabled = '1'
inputPosition = 'top'
lang = 'zh-CN'

[params.homeInfoParams]
Title = "欢迎来到土豆教主的逆袭之路"
Content = """
这里记录着一个普通土豆教主的打怪升级历程

📚 网站功能：
- [连载小说式的开发日记](/posts/)
- [技术学习笔记](/tech-notes/)
- [项目实战经验](/projects/)
- [踩坑与解决方案](/solutions/)
"""

[[menu.main]]
name = "首页"
url = "/"
weight = 1

[[menu.main]]
name = "开发日记"
url = "/posts/"
weight = 2

[[menu.main]]
name = "技术笔记"
url = "/tech-notes/"
weight = 3

[[menu.main]]
name = "项目实战"
url = "/projects/"
weight = 4

[[menu.main]]
name = "踩坑记录"
url = "/solutions/"
weight = 5

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 6

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 7

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 8

# 相关文章：先按标签匹配，再按系列匹配（同栏目兜底在模板里做）
[related]
threshold = 20
includeNewer = true
toLower = false

[[related.indices]]
name = 'tags'
weight = 100

[[related.indices]]
name = 'series'
weight = 60

# 搜索依赖首页的 index.json：不显式声明 JSON，Hugo 不会生成该文件，
# 搜索就会去读旧产物，导致搜不到新文章
[outputs]
home = ['HTML', 'RSS', 'JSON']

# 中文检索调优：忽略位置、放宽阈值，短词也能命中
[params.fuseOpts]
iscasesensitive = false
threshold = 0.4
ignorelocation = true
minmatchcharlength = 1
limit = 20
keys = ['title', 'permalink', 'summary', 'content', 'compact']

[markup.highlight]
# PaperMod 的语法配色靠 class 生效，用内联样式的话深色模式会串色
noClasses = false

# ── giscus 收尾说明 ───────────────────────────────────────────────────
# Discussions 已开启，repoId / categoryId 都取自仓库的实际数据，不需要再配。
# 唯一还要人工点一下的是给这个仓库安装 giscus App（只影响「实际发评论」这个动作）：
#   https://github.com/apps/giscus/installations/new
